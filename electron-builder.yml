appId: com.ivec.draw
productName: ivec draw
copyright: Copyright © 2026 ivec
directories:
  output: dist
  buildResources: electron/resources
files:
  - out/**/*
  - package.json
linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Development
  icon: electron/resources/icon.png
win:
  target:
    - nsis
    - portable
  icon: electron/resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
artifactName: ${name}-${version}-${os}-${arch}.${ext}
