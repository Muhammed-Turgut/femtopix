appId: com.femtopix.app
productName: femtopix
copyright: Copyright © 2026 femtopix
directories:
  output: dist
  buildResources: electron/resources
files:
  - out/**/*
  - package.json
linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Development
  icon: electron/resources/icon.png
win:
  target:
    - zip
    - nsis
  icon: electron/resources/icon.png
  artifactName: ${name}-${version}-windows-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-windows-setup-${arch}.${ext}
portable:
  artifactName: ${name}-${version}-windows-portable-${arch}.${ext}
artifactName: ${name}-${version}-${os}-${arch}.${ext}
